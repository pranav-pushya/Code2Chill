name: Verify scaffold
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: code2chill
          POSTGRES_DB: code2chill
          POSTGRES_PASSWORD: runner_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U code2chill -d code2chill"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the backend
        working-directory: backend
        env:
          POSTGRES_PASSWORD: runner_only
          DB_HOST_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          python -m pip install uv==0.13.9
          uv sync --locked
          uv run --locked ruff check app migrations tests
          uv run --locked ruff format --check app migrations tests
          uv run --locked python -m pytest -q
      - name: Check and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run build
