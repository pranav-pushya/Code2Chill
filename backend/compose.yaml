services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: code2chill
      POSTGRES_USER: code2chill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected environment file}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code2chill -d code2chill"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
