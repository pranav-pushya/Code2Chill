services:
  db:
    ports: !reset []
  api:
    build:
      context: ..
      target: api
    environment:
      DB_HOST: db
      DB_HOST_PORT: "5432"
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      RECRUITMENT_SMTP_HOST: ${RECRUITMENT_SMTP_HOST:-}
      RECRUITMENT_SMTP_PORT: ${RECRUITMENT_SMTP_PORT:-465}
      RECRUITMENT_MAIL_FROM: ${RECRUITMENT_MAIL_FROM:-}
      RECRUITMENT_SMTP_USER: ${RECRUITMENT_SMTP_USER:-}
      RECRUITMENT_SMTP_PASSWORD: ${RECRUITMENT_SMTP_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the staging database password}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=4).close()"]
      interval: 5s
      timeout: 6s
      retries: 12
  web:
    build:
      context: ..
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STAGING_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
