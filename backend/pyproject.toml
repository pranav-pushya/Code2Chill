[project]
name = "code2chill-api"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi<1",
    "uvicorn<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "python-dotenv>=1,<2",
    "tzdata>=2026.6",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1,<26",
]

[dependency-groups]
dev = ["ruff", "pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Long driver tracebacks include connection arguments on database errors.
addopts = "--tb=short"

[tool.ruff]
target-version = "py313"
line-length = 100
