[project]
name = "code2chill-api"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi<1",
    "uvicorn<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "python-dotenv>=1,<2",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = ["ruff", "pytest", "httpx"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
